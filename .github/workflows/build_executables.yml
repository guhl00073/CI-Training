name: Build Executables

# ─── Trigger: nur auf versionierten Tags (z.B. v1.0.0) ──────────────────────
on:
  push:
    tags:
      - "v*.*.*"
  # Manuelle Ausführung über GitHub UI möglich
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer (z.B. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Build auf macOS und Windows
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # Beide Builds laufen durch, auch wenn einer scheitert
      matrix:
        include:
          - os: macos-latest
            os_name: macOS
            artifact_name: CI-Hörtrainer-macOS
            dist_path: dist/CI-Hörtrainer.app
            archive_cmd: >
              cd dist &&
              zip -r CI-Hörtrainer-macOS.zip CI-Hörtrainer.app &&
              mv CI-Hörtrainer-macOS.zip ..

          - os: windows-latest
            os_name: Windows
            artifact_name: CI-Hörtrainer-Windows
            dist_path: dist\CI-Hörtrainer
            archive_cmd: >
              cd dist &&
              7z a CI-Hörtrainer-Windows.zip CI-Hörtrainer &&
              move CI-Hörtrainer-Windows.zip ..

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python einrichten ───────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. System-Abhängigkeiten (macOS) ──────────────────────────────────
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install portaudio ffmpeg || true

      # ── 4. Python-Pakete installieren ─────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0

      # ── 5. Einheitliche Verzeichnisse sicherstellen ───────────────────────
      - name: Ensure required directories exist
        shell: bash
        run: |
          mkdir -p data models docs/images

      # ── 6. Build mit PyInstaller ──────────────────────────────────────────
      - name: Build executable
        run: |
          pyinstaller ci_trainer.spec --clean --noconfirm

      # ── 6b. macOS Launcher Wrapper ────────────────────────────────────────
      - name: Setup macOS Launcher Wrapper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          MACOS_DIR="dist/CI-Hörtrainer.app/Contents/MacOS"
          if [ -f "$MACOS_DIR/CI-Hörtrainer" ] && [ ! -f "$MACOS_DIR/CI-Hörtrainer-bin" ]; then
            mv "$MACOS_DIR/CI-Hörtrainer" "$MACOS_DIR/CI-Hörtrainer-bin"
            printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport PYTHONPATH="$DIR/../Resources:$PYTHONPATH"\ncd "$DIR/../Resources"\nexec "$DIR/CI-Hörtrainer-bin" "$@"\n' > "$MACOS_DIR/CI-Hörtrainer"
            chmod +x "$MACOS_DIR/CI-Hörtrainer" "$MACOS_DIR/CI-Hörtrainer-bin"
          fi
          python scripts/sign_mac_app.py "dist/CI-Hörtrainer.app" || true

      # ── 7. Archivieren ────────────────────────────────────────────────────
      - name: Package build artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.archive_cmd }}

      - name: Package build artifact (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ${{ matrix.archive_cmd }}

      # ── 8. Artifact hochladen ─────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            CI-Hörtrainer-macOS.zip
            CI-Hörtrainer-Windows.zip
          if-no-files-found: warn
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # JOB: GitHub Release erstellen (läuft nur wenn alle Builds erfolgreich)
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Erlaubt Release erstellen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Alle Build-Artifacts herunterladen
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Versionsnummer ermitteln
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      # Release erstellen und macOS/Windows Binaries anhängen
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "CI-Hörtrainer v${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          files: |
            artifacts/CI-Hörtrainer-macOS.zip
            artifacts/CI-Hörtrainer-Windows.zip
          body: |
            ## CI-Hörtrainer v${{ steps.get_version.outputs.version }}

            ### Downloads
            | Plattform | Download | Hinweise |
            |:---|:---|:---|
            | 🍎 macOS | `CI-Hörtrainer-macOS.zip` | Entpacken → `.app` in Programme ziehen |
            | 🪟 Windows | `CI-Hörtrainer-Windows.zip` | Entpacken → `CI-Hörtrainer.exe` starten |

            ### Voraussetzungen
            - **macOS:** 12 Monterey oder neuer
            - **Windows:** Windows 10 oder neuer
            - Internetzugang für Azure Neural Voices (Edge-TTS), sonst lokale Stimmen
